<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>New Template</title>
<style>
@font-face{font-family:'Thmanyah Sans';src:url('./fonts/ThmanyahSans-Bold.woff2') format('woff2');font-weight:700;font-style:normal;}
@font-face{font-family:'Thmanyah Sans';src:url('./fonts/ThmanyahSans-Regular.woff2') format('woff2');font-weight:400;font-style:normal;}
@font-face{font-family:'Thmanyah Sans';src:url('./fonts/ThmanyahSans-Medium.woff2') format('woff2');font-weight:500;font-style:normal;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html, body { width:1080px; height:1920px; overflow:hidden; margin:0; padding:0; background:#0b0b0f; font-family:'Thmanyah Sans','Plus Jakarta Sans',system-ui,sans-serif; direction:rtl; }
.container{position:relative;width:1080px;height:1920px;background:#0b0b0f;overflow:hidden;}
.bg-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.bg-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,11,15,.25) 0%,rgba(11,11,15,.15) 40%,rgba(11,11,15,.9) 100%);pointer-events:none;}
.el{position:absolute;box-sizing:border-box;will-change:opacity,transform;}
#l0{left:10.366429804803651%;top:58.11260746514878%;width:77%;text-align:center;font-size:72px;font-weight:700;color:#ffffff;opacity:1;z-index:2;}
#l0{height:420px;background:rgba(15,23,42,0.85);border:2px solid rgba(255,183,3,0.3);border-radius:28px;backdrop-filter:blur(16px);box-shadow:0 25px 50px rgba(0,0,0,0.6);}
#l1{left:8%;top:35%;width:auto;text-align:right;font-size:64px;font-weight:700;color:#ffffff;opacity:1;z-index:3;}
#l2{left:92%;top:0%;width:1.5%;text-align:right;font-size:72px;font-weight:700;color:#ffffff;opacity:1;z-index:4;}
#l2{height:100px;background:#e63946;}
#l3{left:8%;top:84%;width:auto;text-align:right;font-size:72px;font-weight:700;color:#ffffff;opacity:1;z-index:5;}
#l3 .lb{display:inline-flex;align-items:center;gap:14px;background:#e63946;padding:14px 30px;color:#fff;line-height:1;}
#l3 .lb-ar{font-size:72px;font-weight:700;}
#l3 .lb-en{font-size:45px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:3px;}
#l4{left:8%;top:62%;width:84%;text-align:center;font-size:72px;font-weight:700;color:#ffffff;opacity:1;z-index:6;}
#l5{left:8%;top:74%;width:84%;text-align:center;font-size:38px;font-weight:400;color:rgba(255,255,255,0.65);opacity:1;z-index:7;}
#l6{left:10%;top:91%;width:auto;text-align:right;font-size:22px;font-weight:400;color:rgba(255,255,255,0.3);opacity:1;z-index:8;}
#l7{left:8%;top:95.5%;width:auto;text-align:right;font-size:24px;font-weight:400;color:rgba(255,255,255,0.35);opacity:1;z-index:9;}
#l8{left:8%;top:5%;width:auto;text-align:right;font-size:64px;font-weight:700;color:#ffffff;opacity:1;z-index:10;}
#l9{left:92%;top:22%;width:1.5%;text-align:right;font-size:72px;font-weight:700;color:#ffffff;opacity:1;z-index:11;}
#l9{height:100px;background:#e63946;}
</style>
</head>
<body>
<div class="container">
  <div class="bg-media"><video class="bg-media" id="bgVideo" autoplay loop muted playsinline style="display:none"></video>
     <img class="bg-media" id="bgImage" style="display:none" /></div>
  <div class="bg-overlay" id="bgOverlay"></div>
<div class="el" id="l0" data-type="card"></div>
<div class="el" id="l1" data-type="logo">KASHIDA</div>
<div class="el" id="l2" data-type="accentBar"></div>
<div class="el" id="l3" data-type="label"><span class="lb"><span class="lb-ar">NEWS</span><span class="lb-en">ALERT</span></span></div>
<div class="el" id="l4" data-type="headline">Main Headline</div>
<div class="el" id="l5" data-type="subheadline">Secondary details appear here</div>
<div class="el" id="l6" data-type="timestamp"></div>
<div class="el" id="l7" data-type="footer">kashida.io</div>
<div class="el" id="l8" data-type="logo">KASHIDA</div>
<div class="el" id="l9" data-type="accentBar"></div>
</div>
<script src="./gsap.min.js"></script>
<script>
(function() {
  var tl = gsap.timeline({ paused: true });
  tl.fromTo('#l0', { opacity: 0, y: 40 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: 'power2.out' }, 0.6);
  tl.fromTo('#l1', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0.11);
  tl.fromTo('#l2', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l3', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l4', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l5', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l6', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l7', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l8', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  tl.fromTo('#l9', { opacity: 0 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' }, 0);
  window.mainTimeline = tl;

  window.loadNewsData = function(data) {
    data = data || {};
    var setText = function(sel, val) {
      var el = document.querySelector(sel);
      if (el && val) el.textContent = val;
    };
    var setProp = function(sel, fn) {
      var el = document.querySelector(sel);
      if (el) fn(el);
    };

    setText('#l3 .lb-ar', data.labelAr);
    setText('#l3 .lb-en', data.labelEn);
    setText('#l4', data.headline);
    setText('#l5', data.subheadline);
    setText('#l6', data.timestamp);
    if (data.accentColor) {
      setProp('#l2', function(e){ e.style.background = data.accentColor; });
      setProp('#l3 .lb', function(e){ e.style.background = data.accentColor; });
      setProp('#l9', function(e){ e.style.background = data.accentColor; });
    }
    if (data.backgroundColor) { var c = document.querySelector('.container'); if(c) c.style.background = data.backgroundColor; document.body.style.background = data.backgroundColor; }
    document.getElementById('bgOverlay').style.opacity = 0.55;

    // Render-time position overrides (legacy + generic).
    var pos = function(type) {
      var map = { headline: 'headlinePos', label: 'badgePos', logo: 'logoPos' };
      var key = map[type];
      var generic = data.layerPositions && data.layerPositions[type];
      return generic || (data[key] ? { x: data[key].x, y: data[key].y } : null);
    };
    ['headline', 'label', 'logo'].forEach(function(type) {
      var p = pos(type);
      if (!p) return;
      var el = document.querySelector('[data-type="' + type + '"]');
      if (!el) return;
      el.style.left = p.x + '%';
      el.style.top = p.y + '%';
    });

    // Background media.
    var mediaUrl = data.videoUrl || data.imageUrl || '';
    var isVideo = mediaUrl && (data.videoUrl && !data.videoUrl.match(/\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i) || mediaUrl.match(/\.(mp4|webm|mov|m4v)(\?.*)?$/i));
    var vid = document.getElementById('bgVideo');
    var img = document.getElementById('bgImage');
    if (isVideo && mediaUrl) {
      vid.src = mediaUrl; vid.style.display = 'block'; img.style.display = 'none';
      if (data.videoFit) vid.style.objectFit = data.videoFit;
      vid.style.objectPosition = (data.videoPositionX ?? 50) + '% ' + (data.videoPositionY ?? 50) + '%';
      vid.style.transform = 'scale(' + (data.videoScale ?? 1) + ')';
    } else if (mediaUrl) {
      img.src = mediaUrl; img.style.display = 'block'; vid.style.display = 'none';
      if (data.imageFit) img.style.objectFit = data.imageFit;
      img.style.objectPosition = (data.imagePositionX ?? 50) + '% ' + (data.imagePositionY ?? 50) + '%';
      img.style.transform = 'scale(' + (data.imageScale ?? 1) + ')';
    }
    if (data.overlayOpacity !== undefined) {
      document.getElementById('bgOverlay').style.opacity = data.overlayOpacity;
    }
  };

  window.seekToFrame = function(frameNumber, fps) {
    var timeInSeconds = frameNumber / fps;
    window.mainTimeline.pause();
    window.mainTimeline.seek(timeInSeconds);
    var vid = document.getElementById('bgVideo');
    if (vid && vid.src) {
      try {
        vid.pause();
        if (vid.duration && !isNaN(vid.duration)) vid.currentTime = timeInSeconds % vid.duration;
        else vid.currentTime = timeInSeconds;
      } catch (e) {}
    }
  };
})();
</script>
</body>
</html>
